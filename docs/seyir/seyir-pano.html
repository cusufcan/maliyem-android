<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maliyem Panosu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EFEBF3;--fg:#1D1A21;--mute:#5A5164;--line:#D6CFDD;--ctl:#FCF8FF}
@media (prefers-color-scheme:dark){:root{--bg:#0E0C10;--fg:#E7E0EE;--mute:#A99FB4;--line:#3A3243;--ctl:#1B171F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px Inter,system-ui,sans-serif;padding:32px 16px 48px}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.page{max-width:1640px;margin:auto}
h1{font:700 28px/32px Inter,sans-serif;margin:0 0 8px}
.intro{max-width:70ch;color:var(--mute);margin:0}
.ctls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 32px}
.grp{display:flex;gap:4px;background:var(--ctl);border:1px solid var(--line);border-radius:24px;padding:4px}
.grp button{min-height:36px;padding:0 14px;border-radius:18px;font-weight:600;font-size:13px}
.grp button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:40px 24px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{width:100%;max-width:360px;order:-1}
figcaption b{display:block;font-size:14px;line-height:18px}
figcaption span{font-size:12px;line-height:17px;color:var(--mute)}

/* Seyir rolleri */
.phone{--p:#6200EE;--op:#FFF;--pc:#EDDCFF;--opc:#22005D;--sc:#DECAF1;--osc:#2A1641;--su:#FCF8FF;--on:#1D1A21;--low:#F7F2FB;--c:#F1ECF5;--h:#ECE6F1;--v:#4F4559;--olv:#D6CFDD;--sel:#644789;--osel:#FFF;--pos:#DCECE2;--opos:#22604D;--ip:#DBB8FF}
.phone.dark{--p:#DBB8FF;--op:#381E72;--pc:#3C245B;--opc:#EDDCFF;--sc:#4D336E;--osc:#EDDCFF;--su:#151218;--on:#E7E0EE;--low:#1B171F;--c:#221E27;--h:#2B2630;--v:#CDC2D8;--olv:#50445D;--sel:#DBB8FF;--osel:#381E72;--pos:#203A30;--opos:#B7DEC9;--ip:#6200EE}
.phone{width:100%;max-width:360px;height:780px;border-radius:40px;padding:5px;background:#332F37;border:1px solid #BCB2C5}
.in{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--su);color:var(--on);transition:background-color .18s,color .18s}
.status{position:absolute;inset:0 0 auto;height:38px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font:600 12px/17px Inter,system-ui,sans-serif;z-index:2}
.status i{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.gest{position:absolute;bottom:6px;left:50%;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:var(--on);opacity:.75;z-index:9}
.scr{position:absolute;inset:38px 0 78px;padding:8px 16px 88px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.scr.nf{padding-bottom:16px}
.nav{position:absolute;inset:auto 0 0;height:78px;padding:6px 8px 18px;display:flex;background:var(--h);border-top:1px solid var(--olv)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px/15px Inter,system-ui,sans-serif;color:var(--v);padding-top:4px}
.nav span{width:48px;height:26px;border-radius:13px;display:grid;place-items:center}
.nav .on{color:var(--on);font-weight:700}.nav .on span{background:var(--pc);color:var(--opc)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.top{display:flex;align-items:center;gap:4px;min-height:48px}
.top>div{flex:1;min-width:0}
.top h2{margin:0;font:700 28px/32px Inter,system-ui,sans-serif}
.sub{font-size:12px;line-height:17px;color:var(--v)}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--v)}
.eyebrow{font:700 11px/15px Inter,system-ui,sans-serif;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--pc);color:var(--opc);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:4px}
.big{font:700 64px/68px Inter,system-ui,sans-serif;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font:700 24px/28px Inter,system-ui,sans-serif;letter-spacing:-.01em}
.hero .k{font:500 14px/20px Inter,system-ui,sans-serif}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--c);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile.g{background:var(--pos);color:var(--opos)}
.tile .l{display:flex;align-items:center;gap:6px;font:600 12px/17px Inter,system-ui,sans-serif}
.tile .l svg{width:16px;height:16px}
.tile b{font:700 20px/24px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--c);border-radius:20px;padding:16px}
.trend-card{display:grid;gap:8px}
.trend-legend{display:flex;gap:12px}
.trend-legend span{display:inline-flex;align-items:center;gap:4px}
.trend-legend i{width:10px;height:10px}
.trend-pairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.trend-pairs button{display:grid;justify-items:center;gap:4px;padding:4px 0;border-radius:12px;font-size:11px;line-height:15px;color:var(--v)}
.trend-pairs button[aria-pressed=true]{background:var(--pc);color:var(--opc);font-weight:700}
.trend-pair{height:88px;width:100%;display:flex;justify-content:center;align-items:end;gap:4px}
.trend-pair i{width:min(30%,16px);animation:trend-grow .18s ease-out;transform-origin:bottom}
@keyframes trend-grow{from{transform:scaleY(0)}}
.trend-income{background:var(--opos);border-radius:3px}
.trend-expense{border:2px solid var(--v);border-radius:3px}
.trend-pair .zero{height:2px;background:var(--v);border:0;border-radius:1px;animation:none}
.dist .trend-amount{text-align:right}
.sec{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.sec .lnk{font-weight:600;color:var(--p);min-height:48px;display:flex;align-items:center;margin:-12px 0}
.tx{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;width:100%}
.list .tx+.tx{border-top:1px solid var(--olv)}
.tx .ci{width:40px;height:40px;border-radius:20px;background:var(--sc);color:var(--osc);display:grid;place-items:center;flex:none}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font:500 16px/23px Inter,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font:600 16px/23px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .a.g{color:var(--opos)}
.tx.new{background:var(--pc);color:var(--opc);border-radius:16px;margin:0 -8px;padding:8px;width:calc(100% + 16px);animation:nw .2s ease-out}
.tx.new .sub,.tx.new .a{color:inherit}
@keyframes nw{from{opacity:0;transform:translateY(-6px)}}
.list{background:var(--c);border-radius:20px;padding:0 16px}
.dh{display:flex;justify-content:space-between;padding:8px 4px 0;color:var(--v)}
.fab{position:absolute;right:16px;bottom:94px;min-height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--p);color:var(--op);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;z-index:3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--olv);display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;transition:background-color .15s,color .15s}
.chips button svg{width:18px;height:18px}
.chips [aria-pressed=true]{background:var(--sel);color:var(--osel);border-color:transparent}
.chips.f button{padding:0 16px}
.tx-search{display:flex;align-items:center;border:1px solid var(--olv);border-radius:12px;padding-left:12px;min-width:0}
.tx-search input{flex:1;min-width:0;color:var(--on);font:inherit}
.tx-results{display:flex;flex-direction:column;gap:12px}
.tx-range{margin:0;font:700 22px/28px Inter,system-ui,sans-serif}
.tx-summary{display:grid;gap:4px}
.tx-filters{max-height:91%}
.tx-filters .fields{display:grid;gap:8px;overflow-y:auto}
.tx-amount{min-height:52px;border:1px solid var(--olv);border-radius:12px;padding:0 12px;color:var(--on);font:inherit}
.tx-active{flex-wrap:nowrap;overflow:auto;scrollbar-width:none}
.tx-active button{white-space:nowrap}
.seg{display:flex;background:var(--h);border-radius:24px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:20px;text-align:center;font-weight:500;color:var(--v);transition:background-color .15s,color .15s}
.seg [aria-pressed=true]{background:var(--sel);color:var(--osel);font-weight:600}
.card .seg{margin-top:10px}
.lb{font:600 14px/18px Inter,system-ui,sans-serif}
.rw{display:flex;align-items:center;gap:12px;min-height:56px;width:100%}.rw>div{flex:1;min-width:0}
.rw+.rw{border-top:1px solid var(--olv)}
.rw .g{color:var(--v);font-size:14px;text-align:right}
.rw>svg{color:var(--v)}
.ctr{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding-bottom:24px}
.ctr .ic{width:56px;height:56px;border-radius:28px;background:var(--pc);color:var(--opc);display:grid;place-items:center}
.ctr .ic svg{width:26px;height:26px}
.ctr h3{margin:0;font:700 32px/36px Inter,system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.ctr p{margin:0;font-size:16px;line-height:23px;color:var(--v)}
.btn{min-height:48px;padding:0 24px;border-radius:24px;background:var(--p);color:var(--op);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.t{background:var(--sc);color:var(--osc)}
.btn.x{background:none;color:var(--p);padding:0 12px}
.btn.w{width:100%}
.scrim{position:absolute;inset:0;background:rgba(18,12,24,.42);z-index:4;animation:fd .2s}
.sheet{position:absolute;inset:auto 0 0;background:var(--low);border-radius:28px 28px 0 0;padding:8px 16px 28px;display:flex;flex-direction:column;gap:14px;z-index:5;animation:up .2s ease-out}
.sheet .hd{width:32px;height:4px;border-radius:2px;background:var(--olv);align-self:center;margin-bottom:4px}
.sheet h3{margin:0;font:700 22px/28px Inter,system-ui,sans-serif}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--p);padding-bottom:4px}
.amt input{flex:1;min-width:0;font:700 44px/52px Inter,system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;cursor:text}
.amt span{font:700 24px/28px Inter,system-ui,sans-serif;color:var(--v)}
.snk{position:absolute;left:16px;right:16px;bottom:94px;min-height:48px;border-radius:12px;background:var(--on);color:var(--su);display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;z-index:6;animation:up .2s ease-out}
.snk span{flex:1}
.snk button{min-height:40px;padding:0 12px;border-radius:20px;color:var(--ip);font-weight:600}
.dist .rw{min-height:64px;align-items:center}
.dist .ci{width:40px;height:40px;border-radius:20px;background:var(--sc);color:var(--osc);display:grid;place-items:center;flex:none}
.dist .t{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:15px}
.dist .t .num{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--h);margin-top:6px;display:flex;align-items:center;gap:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--p);transition:width .18s}
.pc{font-size:12px;line-height:17px;color:var(--v);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.phone{--budget-warn:#78502F;--budget-over:#BA1A1A}
.phone.dark{--budget-warn:#EDC7AA;--budget-over:#FFB4AB}
.budget-card{padding:4px 0}
.budget-card .lb{padding:8px 16px 0}
.budget-row{--status:var(--v);display:flex;gap:8px;align-items:center;width:100%;padding:8px 16px}
.budget-row+.budget-row{border-top:1px solid var(--olv)}
.budget-row.warn{--status:var(--budget-warn)}
.budget-row.over{--status:var(--budget-over)}
.budget-row .status-text,.budget-row>svg{color:var(--status)}
.budget-row .budget-body{display:grid;gap:4px;flex:1;min-width:0}
.budget-row .budget-title{display:flex;justify-content:space-between;gap:8px}
.budget-row .bar{height:4px;margin:0;background:var(--olv)}
.budget-row .bar i{background:var(--status)}
.budget-edit{position:absolute;z-index:5;top:50%;left:24px;right:24px;transform:translateY(-50%);display:grid;gap:12px;background:var(--c);border-radius:28px;padding:24px}
.budget-edit h3{margin:0;font-size:22px;line-height:28px}
.budget-edit label{display:grid;gap:4px}
.budget-edit .remove{min-height:48px;color:var(--budget-over)}
.strip{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.strip i{background:var(--p)}
.det{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 8px}
.det .ci{width:56px;height:56px;border-radius:28px;background:var(--sc);color:var(--osc);display:grid;place-items:center}
.det .ci svg{width:26px;height:26px}
.det .big{font-size:52px;line-height:56px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.widget-stage{position:absolute;inset:38px 0 16px;display:grid;align-content:center;justify-items:center;gap:16px;padding:12px}
.widget-shortcuts{display:flex;gap:4px}
.widget-card{width:156px;padding:4px 8px;border-radius:20px;background:var(--pc);color:var(--opc);cursor:pointer}
.widget-card.wide{width:204px;padding:12px 8px}
.widget-label{font-size:11px}
.widget-net{font-size:15px;font-weight:700}
.wide .widget-net{font-size:22px}
.widget-figures,.widget-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.widget-figures b{display:block;font-size:12px}
.widget-actions button{height:26px;border:0;border-radius:12px;background:var(--su);color:var(--on);font-size:11px;text-align:center;font-weight:600;cursor:pointer}
.widget-actions button:last-child{background:var(--pos);color:var(--opos)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="page">
<h1>Maliyem</h1>
<p class="intro">Kasım 2026 verileriyle Maliyem ekranları. İşlemler aramasını, tür ve kategori filtrelerini, kayıt ve bütçe işlemlerini ekran örneklerinde deneyebilirsin.</p>
<div class="ctls">
<div class="grp" data-ctl="tema" role="group" aria-label="Tema"><button data-v="karma" aria-pressed="true">Karma</button><button data-v="acik" aria-pressed="false">Hepsi açık</button><button data-v="koyu" aria-pressed="false">Hepsi koyu</button></div>
</div>
<div class="board" id="board"></div>
</div>
<script>
// Kategoriler: ad, simge, tür (0 gider, 1 gelir)
const C={"Market":["cart",0],"Kira":["home",0],"Faturalar":["bolt",0],"Ulaşım":["bus",0],"Yeme içme":["cup",0],"Sağlık":["heart",0],"Diğer":["dots",0],"Maaş":["wallet",1],"Serbest iş":["brief",1],"Diğer gelir":["dots",1]};
// Kayıtlar: id, gün, kategori, not, tutar (kuruş). Gelir/gider kategoriden gelir.

const overallBudget="Genel aylık bütçe";

const mo=(t,s="")=>`<div class="top"><button class="ib" aria-label="Önceki ay" style="margin-left:-12px">${i("prev")}</button><div style="text-align:center"><h2 style="font-size:22px;line-height:28px">${t}</h2>${s?`<div class="sub">${s}</div>`:""}</div><button class="ib" aria-label="Sonraki ay" style="margin-right:-12px">${i("next")}</button></div>`;

const hero=(net,inC,outC)=>{const [a,b]=f(net).split(",");return `<div class="hero"><div class="eyebrow">Kasım neti</div><div class="big">${net<0?"−":"+"}${a}<small>,${b} ₺</small></div><div class="k">Gelirin %${Math.round(outC/inC*100)}'i harcandı</div></div>`};
const budgetUsage=(title,spent,limit)=>{
 const pc=Math.floor(spent*100/limit),delta=limit-spent;
 const tone=delta<0?"over":pc>=80?"warn":"";
 return `<button class="budget-row ${tone}" data-budget-open="${title}"><div class="budget-body">
 <div class="budget-title"><span>${title}</span><span class="status-text num">%${pc}</span></div>
 <span class="bar"><i style="width:${Math.min(spent*100/limit,100)}%"></i></span>
 <span class="sub num">${f(spent)} ₺ / ${f(limit)} ₺</span>
 <span class="sub status-text num">${delta<0?`Aşıldı (${f(delta)} ₺)`:`Kalan ${f(delta)} ₺`}</span>
 </div>${i("next")}</button>`;
};
const budgetCard=xs=>{
 const cats=Object.entries(budgetLimits).filter(([n])=>n!==overallBudget)
   .map(([n,limit])=>[n,sum(xs,t=>t[2]===n),limit]).sort((a,b)=>b[1]/b[2]-a[1]/a[2]).slice(0,3);
 const overall=budgetLimits[overallBudget];
 return overall||cats.length?`<div class="card budget-card"><div class="lb">Bütçeler</div>
 ${overall?budgetUsage(overallBudget,sum(xs,t=>!inc(t)),overall):""}${cats.map(args=>budgetUsage(...args)).join("")}</div>`:"";
};
const trendSample={[-5]:[.9,.85],[-4]:[1,.94],[-2]:[.88,1.05],[-1]:[.93,1.136],[0]:[1,1]};
const trendRows=offset=>trendSample[offset]?live().map(t=>[...t.slice(0,4),Math.round(t[4]*trendSample[offset][inc(t)?0:1])]):[];
const trendMonth=(offset,options={month:"long",year:"numeric"})=>{
 const label=new Date(2026,10+offset,1).toLocaleDateString("tr-TR",options);
 return label.charAt(0).toLocaleUpperCase("tr-TR")+label.slice(1);
};
const trendNav=offset=>{
 const available=[...Object.keys(trendSample).map(Number),1].sort((a,b)=>a-b);
 const prev=available.filter(m=>m<offset).at(-1),next=available.find(m=>m>offset);
 return mo(trendMonth(offset))
   .replace('aria-label="Önceki ay"',prev===undefined?'aria-label="Önceki ay" disabled':`aria-label="Önceki ay" data-trend-month="${prev}"`)
   .replace('aria-label="Sonraki ay"',next===undefined?'aria-label="Sonraki ay" disabled':`aria-label="Sonraki ay" data-trend-month="${next}"`);
};
const trendTotals=offset=>{const xs=trendRows(offset);return [sum(xs,inc),sum(xs,t=>!inc(t))]};
const signedMoney=k=>`${k<0?"−":k>0?"+":""}${f(k)} ₺`;
const change=(current,previous)=>previous?Math.sign(current-previous)*Math.round(Math.abs(current-previous)*100/previous):null;
const trendCard=offset=>{
 const pairs=Array.from({length:6},(_,index)=>trendTotals(offset+index-5));
 const max=Math.max(1,...pairs.flat()),[income,expense]=pairs[5],[pastIncome,pastExpense]=pairs[4];
 const delta=change(expense,pastExpense);
 const details=delta===null?"Geçen aya göre gider değişimi: —":delta===0?"Giderler geçen aya göre aynı kaldı":`Giderler geçen aya göre %${Math.abs(delta)} ${delta<0?"az":"fazla"}`;
 return `<div class="card trend-card"><div class="lb">Son 6 ay</div>
 <div class="sub trend-legend"><span><i class="trend-income"></i>Gelir</span><span><i class="trend-expense"></i>Gider</span></div>
 <div class="trend-pairs" role="group" aria-label="Gelir ve gider eğilimi">${pairs.map(([gi,gd],index)=>{
  const month=offset+index-5;
  const bar=(kind,value)=>`<i class="trend-${kind} ${value?"":"zero"}" ${value?`style="height:max(3px,${value/max*100}%)"`:""}></i>`;
  return `<button data-trend-month="${month}" aria-pressed="${month===offset}" aria-label="${trendMonth(month)}. Gelir ${f(gi)} ₺. Gider ${f(gd)} ₺. Net ${signedMoney(gi-gd)}."><span class="trend-pair">${bar("income",gi)}${bar("expense",gd)}</span>${trendMonth(month,{month:"short"})}</button>`;
 }).join("")}</div>
 <div class="sub num">Bu ayın neti: ${signedMoney(income-expense)} · Geçen ay: ${signedMoney(pastIncome-pastExpense)}</div>
 <div class="sub">${details}</div></div>`;
};
const ozet=(st=0,offset=0)=>{
 const xs=trendRows(offset),gi=sum(xs,inc),gd=sum(xs,t=>!inc(t));const last=[...xs].reverse().slice(0,4);
 if(!xs.length)return bos(0,offset);
 return `<div class="scr">${trendNav(offset)}${hero(gi-gd,gi,gd).replace("Kasım neti",trendMonth(offset,{month:"long"})+" neti")}
 <div class="pair"><div class="tile g"><div class="l">${i("in")}Gelir</div><b>${f(gi)} ₺</b></div><div class="tile"><div class="l">${i("out")}Gider</div><b>${f(gd)} ₺</b></div></div>
 ${budgetCard(xs)}

   (!q||[t[2],t[3],"Nakit"].some(x=>searchText(x).includes(q))||(t[4]/100).toFixed(2).startsWith(q.replace(",","."))));
 const days=[...new Set(xs.map(t=>t[1]))].sort((a,b)=>b-a);
 return `${query===null?mo("Kasım 2026",xs.length+" kayıt"):`<h3 class="tx-range">Kasım 2026</h3>
 <div class="card sub tx-summary"><span>${xs.length} kayıt</span><span>Toplam gider: ${f(sum(xs,t=>!inc(t)))} ₺</span><span>Toplam gelir: ${f(sum(xs,inc))} ₺</span></div>`}

 <div class="widget-card ${wide?"wide":""}" data-widget-card>
 <div class="widget-label">Bu ayın neti</div><div class="widget-net">${net<0?"−":net>0?"+":""}${f(net)} ₺</div>
 ${wide?`<div class="widget-figures widget-label"><div>Gider<b>${f(expense)} ₺</b></div><div>Gelir<b>${f(income)} ₺</b></div></div>`:""}
 <div class="widget-actions"><button data-kind="0">− Gider</button><button data-kind="1">+ Gelir</button></div>
 </div></div>`;
};
const S=[["1 · Özet","Ayın neti, bütçe kullanımı ve son altı ay. Çubuk çifti seçili ayı değiştirir.",ozet],
["2 · İşlemler","Ay gezintisi, arama sonucu toplamları ve filtre alt sayfası. Örnek veri Kasım 2026 ile sınırlı.",k=>k===2?txSheet():islem(0,0,k===1),["Ay","Arama","Filtreler"],0],
["3 · Yeni kayıt","Alt sayfa. Gider/Gelir kategorileri değiştirir; “Kaydet” özete döner, yeni kayıt vurgulu ve geri alınabilir.",ekle,["Form","Kaydedildi"],0],
["4 · Dağılım","Kategori tutarının yanında geçen aya göre değişim, altında toplam içindeki pay gösterilir.",()=>dag()],
["5 · Kayıt ayrıntısı","Düzenle ve sil. Silme onay sormaz; “Geri al” ile döner.",ayr,["Ayrıntı","Silindi"],0],
["6 · Kategoriler","Ayarlar’dan açılır. “Diğer” silinemez, silinen kategorinin kayıtları oraya geçer.",()=>kat()],
["7 · Boş durumlar","Yeni ayın ilk günü ve uygulamanın ilk açılışı.",bos,["Yeni ay","İlk açılış"],0],
["8 · Ayarlar","Kategoriler, bütçeler, tema, dil ve veri işlemleri.",ayar],
["9 · Özet, koyu","Aynı ekran, koyu tema.",ozet],
["10 · Bütçeler","Genel aylık limit ve gider kategorileri. Satıra dokununca limit düzenlenir.",k=>budgetSettings(k?"Market":null),["Liste","Limit düzenle"],0],
["11 · Hızlı kayıt","Başlatıcı kısayolları ve widget düğmeleri Yeni kayıt formunu seçilen türde açar.",widget,["2 × 1","Geniş"],0]];
const B=document.getElementById("board");
B.innerHTML=S.map((s,k)=>`<figure data-k="${k}"><figcaption><b>${s[0]}</b><span>${s[1]}</span></figcaption><div class="phone"><div class="in"><div class="status"><span>12.04</span><i></i></div><div class="body">${s[2](s[4])}</div><div class="gest"></div></div></div>${s[3]?`<div class="grp" role="group" aria-label="Durum">${s[3].map((x,j)=>`<button data-st="${j}" aria-pressed="${j===s[4]}">${x}</button>`).join("")}</div>`:""}</figure>`).join("");
const press=b=>[...b.parentElement.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
const theme=m=>B.querySelectorAll(".phone").forEach((p,k)=>p.classList.toggle("dark",m==="koyu"||(m==="karma"&&k===8)));
theme("karma");
const setSt=(fg,j)=>{fg.querySelectorAll("[data-st]").forEach((x,n)=>x.setAttribute("aria-pressed",n===j));fg.querySelector(".body").innerHTML=S[+fg.dataset.k][2](j)};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b){
 const card=e.target.closest("[data-widget-card]");if(card)card.closest(".body").innerHTML=ozet();
 return;
}
 const fg=b.closest("figure"),body=fg&&fg.querySelector(".body"),d=b.dataset;
 if(d.v){press(b);theme(d.v)}
 else if(d.st)setSt(fg,+d.st);
 else if("trendMonth" in d){
  const scr=body.querySelector(".scr"),top=scr.scrollTop,focused=document.activeElement===b;
  body.innerHTML=ozet(0,+d.trendMonth);
  if(focused)body.querySelector('.trend-pairs [aria-pressed="true"]').focus({preventScroll:true});
  body.querySelector(".scr").scrollTop=top;
 }
 else if("budgetSettings" in d)body.innerHTML=budgetSettings();
 else if("budgetOpen" in d)body.innerHTML=islem(1,0,false,d.budgetOpen===overallBudget?null:d.budgetOpen);
 else if("budgetEdit" in d)body.innerHTML=budgetSettings(d.budgetEdit);
 else if("budgetCancel" in d)body.innerHTML=budgetSettings();
 else if("budgetRemove" in d){delete budgetLimits[d.budgetRemove];body.innerHTML=budgetSettings()}
 else if("budgetSave" in d){
  const input=body.querySelector("[data-budget-limit]"), value=input.value.trim().replace(",",".");
  const minor=Math.round(Number(value)*100);
  if(!/^\d+(\.\d{1,2})?$/.test(value)||!Number.isSafeInteger(minor)||minor<=0){input.setCustomValidity("Sıfırdan büyük bir tutar girin.");input.reportValidity();return}
  budgetLimits[d.budgetSave]=minor;body.innerHTML=budgetSettings();
 }
 else if("txClearCategory" in d)body.innerHTML=islem(1);
 else if("txSearch" in d){body.innerHTML=islem(+body.querySelector("[data-tx-type]").dataset.txType,0,true,body.querySelector("[data-tx-type]").dataset.txCategory);const input=body.querySelector("[data-tx-query]");input.value="";input.dispatchEvent(new Event("input",{bubbles:true}));input.focus()}
 else if("txClearSearch" in d)body.innerHTML=islem(+body.querySelector("[data-tx-type]").dataset.txType,0,false,body.querySelector("[data-tx-type]").dataset.txCategory);
 else if("txSheet" in d)body.innerHTML=txSheet(+body.querySelector("[data-tx-type]").dataset.txType);
 else if("txClearFilter" in d)body.innerHTML=islem();
 else if("txApply" in d)body.innerHTML=islem(+body.querySelector('[data-tx-draft][aria-pressed="true"]').dataset.txDraft);
 else if("txDraft" in d)press(b);
 else if("txDate" in d){press(b);body.querySelector("[data-tx-custom]").hidden=d.txDate!=="4"}
 else if("txMulti" in d)b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");
 else if(d.kind)body.innerHTML=ekle(0,+d.kind);
 else if(d.dk)body.innerHTML=dag(+d.dk);
 else if(d.ck)body.innerHTML=kat(+d.ck);
 else if("save" in d){if(+fg.dataset.k===10)body.innerHTML=ozet(1);else setSt(fg,1)}
 else if("del" in d)setSt(fg,1);
 else if("undo" in d)setSt(fg,0);
 else if("chip" in d||"seg" in d)press(b);
});
document.addEventListener("input",e=>{
 const field=e.target;
 if(field.matches("[data-budget-limit]"))field.setCustomValidity("");
 if(!field.matches("[data-tx-query]"))return;
 const screen=field.closest("[data-tx-type]");
 screen.querySelector(".tx-results").innerHTML=txResults(field.value,+screen.dataset.txType,0,screen.dataset.txCategory);
});
</script>
</body>
</html>
